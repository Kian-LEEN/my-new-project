<!DOCTYPE html>
<html>
<head>
    <title>Thực hành HTML Styles</title>
</head>
<body>
    <!-- Tiêu đề với màu sắc -->
    <h1 style="color:blue;">Đây là tiêu đề màu xanh</h1>

    <!-- Đoạn văn với font chữ và kích thước -->
    <p style="font-family:Arial; font-size:20px;">
        Đây là đoạn văn bản với font Arial và cỡ chữ 20px.
    </p>

    <!-- Đoạn văn với màu nền -->
    <p style="background-color:yellow;">
        Đây là đoạn văn có nền màu vàng.
    </p>

    <!-- Đoạn văn với màu chữ -->
    <p style="color:red;">
        Đây là đoạn văn có chữ màu đỏ.
    </p>

    <!-- Đoạn văn in nghiêng và in đậm -->
    <p style="font-style:italic; font-weight:bold;">
        Đây là đoạn văn vừa in nghiêng vừa in đậm.
    </p>

    <!-- Đoạn văn căn giữa -->
    <p style="text-align:center;">
        Đây là đoạn văn được căn giữa.
    </p>
</body>
</html>
