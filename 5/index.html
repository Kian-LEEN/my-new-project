<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Liên kết yêu thích của tôi</title>
</head>
<body>
    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- Liên kết đến một trang web khác -->
        <li><a href="https://www.google.com">Google</a></li>
        <li><a href="https://www.youtube.com">YouTube</a></li>
        <li><a href="https://www.facebook.com">Facebook</a></li>

        <!-- Liên kết mở trong tab mới -->
        <li><a href="https://www.wikipedia.org" target="_blank">Wikipedia (mở tab mới)</a></li>

        <!-- Liên kết đến file HTML khác trong cùng thư mục -->
        <li><a href="about.html">Giới thiệu</a></li>

        <!-- Liên kết đến email -->
        <li><a href="mailto:tenban@example.com">Gửi email cho tôi</a></li>
    </ul>
</body>
</html>
